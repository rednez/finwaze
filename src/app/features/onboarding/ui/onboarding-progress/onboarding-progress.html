<div class="px-6 pt-6 sm:px-10 sm:pt-8">
  <div class="flex items-center justify-between gap-4">
    <span class="text-xs font-medium text-slate-500 dark:text-zinc-400">
      <span>{{ 'misc.onboarding.stepLabel' | translate }}</span>
      <span>{{ activeStep() }}</span>
      <span>{{ 'misc.onboarding.stepOfLabel' | translate }}</span>
      <span>{{ total() }}</span>
    </span>
    <div class="flex items-center gap-1.5">
      @for (step of steps(); track $index) {
        <div
          class="h-1.5 rounded-full transition-all duration-300"
          [class]="
            $index === activeIndex()
              ? 'w-6 bg-violet-500'
              : 'w-1.5 bg-slate-300 dark:bg-zinc-700'
          "
        ></div>
      }
    </div>
  </div>
</div>

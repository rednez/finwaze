<p-toast />

@if (isLoading()) {
  <div class="card flex items-center justify-center">
    <p-progress-spinner ariaLabel="loading" />
  </div>
} @else {
  <div class="p-4 sm:p-6">
    <div
      class="mx-auto max-w-4xl bg-white/40 dark:bg-zinc-900/40 backdrop-blur-2xl border border-white dark:border-zinc-800/50 rounded-4xl shadow-2xl shadow-violet-500/12 dark:shadow-none"
    >
      <app-onboarding-progress [total]="7" [activeIndex]="currentStep()" />

      @if (currentInfoStep(); as step) {
        <app-onboarding-info-step
          [step]="step"
          [showBack]="currentStep() > 0"
          [nextLabel]="nextLabel()"
          (back)="back()"
          (next)="next()"
          (skip)="skip()"
        />
      } @else {
        <app-onboarding-account-step
          [step]="accountStep()"
          [isCurrenciesLoading]="isCurrenciesLoading()"
          [currencies]="currencies()"
          (back)="back()"
          (submitForm)="createAccount($event)"
        />
      }
    </div>
  </div>
}
